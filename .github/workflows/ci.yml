name: CI/CD Workflow

on:
  push:
    branches:
      - main

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Waveflow - RUNNING
        run: |
          curl -sS -X POST "${{ secrets.WAVEFLOW_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.WAVEFLOW_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repoUrl": "Khairulajisyafii/testweb",
              "status": "RUNNING"
            }'

      - name: Validate index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "Error: index.html not found!"
            exit 1
          fi

      - name: Install HTML Validator
        run: npm install -g htmlhint

      - name: Validate HTML
        run: htmlhint index.html

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel Project
        run: |
          vercel link \
            --yes \
            --project "${{ secrets.VERCEL_PROJECT_ID }}" \
            --scope "${{ secrets.VERCEL_ORG_ID }}" \
            --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Pull Vercel Environment Information
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: |
          vercel build \
            --prod \
            --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Notify Waveflow - SUCCESS
        if: success()
        run: |
          curl -sS -X POST "${{ secrets.WAVEFLOW_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.WAVEFLOW_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repoUrl": "Khairulajisyafii/testweb",
              "status": "SUCCESS"
            }'

      - name: Notify Waveflow - FAILED
        if: failure()
        run: |
          curl -sS -X POST "${{ secrets.WAVEFLOW_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.WAVEFLOW_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repoUrl": "Khairulajisyafii/testweb",
              "status": "FAILED"
            }'
