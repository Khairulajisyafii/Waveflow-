name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}

    steps:
    - name: Notify Waveflow CI RUNNING
      if: vars.WAVEFLOW_URL != ''
      run: |
        curl -s -X POST "${{ vars.WAVEFLOW_URL }}/api/ci/webhook" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.CI_WEBHOOK_SECRET }}" \
          -d "{\"repoUrl\":\"${{ github.repository }}\",\"status\":\"RUNNING\"}" \
          --fail || echo "Failed to notify Waveflow"

    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run lint
      run: npm run lint
      
    - name: Run tests
      run: |
        npm run dev &
        # Wait for Next.js dev server to be ready
        for i in {1..30}; do
          curl -s http://127.0.0.1:3000 > /dev/null && break
          sleep 2
        done
        npm test
      
    - name: Run build
      run: npm run build

    - name: Notify Waveflow CI Completion
      if: always() && vars.WAVEFLOW_URL != ''
      run: |
        STATUS="FAILED"
        if [ "${{ job.status }}" = "success" ]; then
          STATUS="SUCCESS"
        fi
        curl -s -X POST "${{ vars.WAVEFLOW_URL }}/api/ci/webhook" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.CI_WEBHOOK_SECRET }}" \
          -d "{\"repoUrl\":\"${{ github.repository }}\",\"status\":\"$STATUS\"}" \
          --fail || echo "Failed to notify Waveflow"
