<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waveflow Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Animated Wave Background -->
    <div class="wave-container">
      <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
        <defs>
          <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
        </defs>
        <g class="parallax">
          <!-- #C8DFDB (light teal) -->
          <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(200, 223, 219, 0.7)" />
          <!-- #66A3BF (medium blue) -->
          <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(102, 163, 191, 0.5)" />
          <!-- #3368A0 (dark blue) -->
          <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(51, 104, 160, 0.3)" />
          <!-- #3368A0 (dark blue solid) -->
          <use xlink:href="#gentle-wave" x="48" y="7" fill="#3368A0" />
        </g>
      </svg>
    </div>

    <div class="section head">
      <div class="nav">
        <ul>
          <li>about waveflow</li>
          <li>credit</li>
          <li>github</li>
        </ul>
      </div>
    </div>
    
    <div class="section body">
      <div class="card">
        <p>LETS GET STARTED</p>
        <div class="input-container">
          <div class="input-group">
            <p>username</p>
            <input type="text" placeholder="put your username here" />
          </div>
          <div class="input-group">
            <p>email</p>
            <input type="email" placeholder="put your email here" />
          </div>
          <div class="input-group">
            <p>password</p>
            <input type="password" placeholder="put your password here" />
          </div>
        </div>
        <div class="card-bottom">
          <div class="button send">
            <p>confirm</p>
          </div>
          <p class="signup">sign up</p>
        </div>
      </div>
    </div>
    
    <div class="section footer">
      <div class="watermark">waveflow copyright all right reserved</div>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
